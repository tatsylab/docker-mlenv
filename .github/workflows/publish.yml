name: Publish development images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-development-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/tatsylab/mlenv-base
  PYTHON_IMAGE: ghcr.io/tatsylab/mlenv-python

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate base image metadata
        id: base-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BASE_IMAGE }}
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push base candidate
        id: base-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: base/Dockerfile
          push: true
          tags: ${{ steps.base-metadata.outputs.tags }}
          labels: ${{ steps.base-metadata.outputs.labels }}
          cache-from: type=gha,scope=mlenv-base
          cache-to: type=gha,mode=max,scope=mlenv-base

      - name: Generate Python image metadata
        id: python-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PYTHON_IMAGE }}
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Python candidate
        id: python-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: python/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}@${{ steps.base-build.outputs.digest }}
          tags: ${{ steps.python-metadata.outputs.tags }}
          labels: ${{ steps.python-metadata.outputs.labels }}
          cache-from: type=gha,scope=mlenv-python
          cache-to: type=gha,mode=max,scope=mlenv-python

      # Keep the mutable development tags unchanged unless both candidate
      # images were built and pushed successfully.
      - name: Promote candidates to development tags
        run: |
          docker buildx imagetools create \
            --tag "${BASE_IMAGE}:dev" \
            "${BASE_IMAGE}@${{ steps.base-build.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${PYTHON_IMAGE}:dev" \
            "${PYTHON_IMAGE}@${{ steps.python-build.outputs.digest }}"
